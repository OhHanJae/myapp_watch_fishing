name: Wear OS CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check project layout and Wear launch config
        run: |
          node tests/watch_redesign_sanity.js
          node tests/play_delivery_sanity.js
      - name: Build and unit test
        run: gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      # Use a short-lived, nonproduction key to exercise the *release AAB* path in PRs.
      # This bundle is never deployed and these credentials are not real Play secrets.
      - name: Verify signed release AAB with ephemeral CI key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/ci-only-upload.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          keytool -genkeypair -noprompt -storetype JKS \
            -keystore "$KEYSTORE" \
            -alias ci-only -storepass ci-pass-1234 -keypass ci-pass-1234 \
            -keyalg RSA -keysize 2048 -validity 3 -dname 'CN=CI only, O=Test'
          PLAY_UPLOAD_KEYSTORE_PATH="$KEYSTORE" \
          PLAY_UPLOAD_STORE_PASSWORD="ci-pass-1234" \
          PLAY_UPLOAD_KEY_ALIAS="ci-only" \
          PLAY_UPLOAD_KEY_PASSWORD="ci-pass-1234" \
            gradle :app:bundleRelease --no-daemon --stacktrace \
              -PplayVersionCode=100001 -PplayVersionName=ci-only
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify "$AAB" > "$RUNNER_TEMP/ci-aab-verify.log" 2>&1
          grep -q 'jar verified' "$RUNNER_TEMP/ci-aab-verify.log"
      # Android Studio checks required wearable features in the installed APK.
      # A successful Gradle compilation alone does not prove device compatibility.
      - name: Verify packaged APK explicitly targets a watch
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          test -f "$APK"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee wear-apk-badging.txt
          grep -F "uses-feature: name='android.hardware.type.watch'" wear-apk-badging.txt
          grep -F "launchable-activity: name='com.eastsea.badahannun.MainActivity'" wear-apk-badging.txt
          echo "PASS: APK has required android.hardware.type.watch and launcher activity"
      - name: Upload verified Wear OS debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bada-hannun-wear-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
