# Google Play internal testing only. No secrets are exposed to pull requests.
# First run workflow_dispatch(mode=bundle_only) for Play Console's first manual upload.
# Pushes to master publish ONLY when repository variable PLAY_DEPLOY_ENABLED=true.
name: Wear OS - Google Play Internal

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: 'First launch: bundle_only; afterwards: publish_internal'
        required: true
        type: choice
        default: bundle_only
        options:
          - bundle_only
          - publish_internal

permissions:
  contents: read

concurrency:
  group: play-internal-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'OhHanJae/myapp_watch_fishing' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' || vars.PLAY_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: google-play-internal
    steps:
      - name: Checkout trusted master
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Install SDK API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate source structure
        run: |
          node tests/catalog_sanity.js
          node tests/watch_redesign_sanity.js
          node tests/play_delivery_sanity.js

      - name: Derive unique Play version code
        shell: bash
        env:
          PLAY_VERSION_CODE_BASE: ${{ vars.PLAY_VERSION_CODE_BASE || '100000' }}
        run: |
          set -euo pipefail
          BASE="$PLAY_VERSION_CODE_BASE"
          if [[ ! "$BASE" =~ ^[0-9]+$ ]]; then
            echo "::error::PLAY_VERSION_CODE_BASE must be a nonnegative integer"
            exit 1
          fi
          CODE=$((10#$BASE + GITHUB_RUN_NUMBER))
          if (( CODE < 1 || CODE > 2100000000 )); then
            echo "::error::Computed Play versionCode is outside 1..2100000000"
            exit 1
          fi
          NAME=$(sed -n 's/^[[:space:]]*versionName = .* ?: "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [[ -z "$NAME" ]]; then
            echo "::error::Unable to find the base versionName in app/build.gradle.kts"
            exit 1
          fi
          echo "PLAY_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "PLAY_VERSION_NAME=$NAME-internal.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Release bundle versionCode: $CODE"

      - name: Decode private upload keystore
        shell: bash
        env:
          PLAY_UPLOAD_KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$PLAY_UPLOAD_KEYSTORE_B64" ]]; then
            echo "::error::Missing google-play-internal environment secret PLAY_UPLOAD_KEYSTORE_B64"
            exit 1
          fi
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/play-upload.jks"
          chmod 600 "$RUNNER_TEMP/play-upload.jks"
          test -s "$RUNNER_TEMP/play-upload.jks"
          echo "PLAY_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/play-upload.jks" >> "$GITHUB_ENV"

      - name: Build signed release AAB and test
        shell: bash
        env:
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in PLAY_UPLOAD_STORE_PASSWORD PLAY_UPLOAD_KEY_ALIAS PLAY_UPLOAD_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing google-play-internal environment secret $key"
              exit 1
            fi
          done
          gradle :app:testDebugUnitTest :app:bundleRelease --no-daemon --stacktrace \
            -PplayVersionCode="$PLAY_VERSION_CODE" \
            -PplayVersionName="$PLAY_VERSION_NAME"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify "$AAB" > "$RUNNER_TEMP/aab-signature-check.log" 2>&1
          grep -q 'jar verified' "$RUNNER_TEMP/aab-signature-check.log" || {
            cat "$RUNNER_TEMP/aab-signature-check.log"
            echo "::error::Release AAB signature verification failed"
            exit 1
          }
          echo "Signed Wear OS AAB ready"

      - name: Save signed AAB for manual first Play Console upload
        uses: actions/upload-artifact@v4
        with:
          name: bada-hannun-play-signed-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error

      - name: Publish exclusively to Google Play internal track
        if: >-
          vars.PLAY_DEPLOY_ENABLED == 'true' &&
          (github.event_name == 'push' || inputs.mode == 'publish_internal')
        # v1.1.5 pinned to a reviewed immutable commit, not a moving tag.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.eastsea.badahannun
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          releaseName: ${{ env.PLAY_VERSION_NAME }}

      - name: Deployment summary
        if: success()
        shell: bash
        env:
          DEPLOY_ENABLED: ${{ vars.PLAY_DEPLOY_ENABLED }}
        run: |
          {
            echo "## 바다한눈 Wear OS - internal test"
            echo "AAB version: $PLAY_VERSION_NAME (code $PLAY_VERSION_CODE)"
            echo ""
            if [[ "$DEPLOY_ENABLED" == "true" && ( "$GITHUB_EVENT_NAME" == "push" || "${{ inputs.mode }}" == "publish_internal" ) ]]; then
              echo "Google Play internal testing upload step completed."
            else
              echo "Bundle-only mode. Download the signed AAB and manually create the first Play Console release."
            fi
            echo "Google Play controls actual device update timing."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/play-upload.jks"
